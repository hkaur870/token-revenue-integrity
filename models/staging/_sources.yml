version: 2

sources:
  - name: raw
    description: Large raw extracts, generated by scripts/generate_data.py and read directly by DuckDB.
    meta:
      external_location: "read_csv_auto('data/raw/{name}.csv', header=true)"
    tables:
      - name: api_requests
        description: One row per API request from metering (retries can create duplicates).
      - name: subscriptions
        description: Monthly Claude app subscription records with API-list-price-equivalent usage.
